[package]
name = "netagg"
version = "1.3.6"
edition = "2021"
license = "MIT"

[lib]
name = "netagg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ipstack = "1"
tun = { version = "0.8", features = ["async"] }
netdev = "0.46"
socket2 = { version = "0.6", features = ["all"] }
etherparse = "0.20"
log = { version = "0.4", features = ["std"] }
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
# DNS-over-TLS and DNS-over-HTTPS upstreams. All already in the tree through the updater (ring, not aws-lc).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-platform-verifier = "0.7"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[dev-dependencies]
# What the updater plugin verifies downloads with, to check release assets the same way.
base64 = "0.22"
minisign-verify = "0.3"
