name: Bug report
description: Something in NetAgg doesn't work as it should.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **This report is public**: leave out names, addresses, DNS servers and anything else
        you'd rather keep to yourself. NetAgg's Settings → Feedback → **Report** fills in the version, system and basic info.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps, if you know them.
      placeholder: |
        1. Turn NetAgg on
        2. …
  - type: input
    id: version
    attributes:
      label: NetAgg version
      placeholder: "2.0.4"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Windows, Linux, or Linux (WebUI).
    validations:
      required: true
  - type: textarea
    id: basic
    attributes:
      label: Basic info
      description: Filled in by NetAgg's **Report** button (or Settings → Feedback → **Copy basic info**). Versions, settings and how many networks of each kind; no names or addresses.
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Settings → Feedback → tick **Include diagnostics**, then **Copy with diagnostics**. It adds your networks' names, speeds and response times, your DNS servers and the error NetAgg shows. Everything here is public.
      render: text
  - type: checkboxes
    id: public
    attributes:
      label: Public report
      options:
        - label: I've checked that nothing private is in this report.
          required: true
